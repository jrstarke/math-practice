<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 0 800 560" width="800" height="560">
  <style>
    .move, .tilt, .wheel, .armL, .armR, .elbowL, .elbowR, .prong { transform-box: view-box; }
    .move  { animation: move 8s ease-in-out infinite; }
    .tilt  { transform-origin: 200px 500px; animation: tilt 8s ease-in-out infinite; }
    .wheel { transform-origin: 200px 500px; animation: spin 8s ease-in-out infinite; }
    .armL  { transform-origin: 145px 291px; animation: armL 8s ease-in-out infinite; }
    .armR  { transform-origin: 255px 291px; animation: armR 8s ease-in-out infinite; }
    .elbowL { transform-origin: 69px 291px; animation: elbowL 8s ease-in-out infinite; }
    .elbowR { transform-origin: 331px 291px; animation: elbowR 8s ease-in-out infinite; }
    .pL1 { transform-origin: 43px 199px;  animation: clampIn 8s ease-in-out infinite; }
    .pL2 { transform-origin: 95px 199px;  animation: clampOut 8s ease-in-out infinite; }
    .pR1 { transform-origin: 305px 199px; animation: clampIn 8s ease-in-out infinite; }
    .pR2 { transform-origin: 357px 199px; animation: clampOut 8s ease-in-out infinite; }
    .glow  { animation: glow 1.4s ease-in-out infinite; }

    /* roll right, roll left, roll back to the middle */
    @keyframes move {
      0%, 8%   { transform: translateX(0px); }
      26%      { transform: translateX(130px); }
      32%      { transform: translateX(130px); }
      50%      { transform: translateX(-130px); }
      56%      { transform: translateX(-130px); }
      68%, 100%{ transform: translateX(0px); }
    }
    /* wheel turns the right amount for the distance rolled (r=32) */
    @keyframes spin {
      0%, 8%   { transform: rotate(0deg); }
      26%, 32% { transform: rotate(233deg); }
      50%, 56% { transform: rotate(-233deg); }
      68%, 100%{ transform: rotate(0deg); }
    }
    /* lean into the direction of travel, wobble a little when stopping */
    @keyframes tilt {
      0%, 8%   { transform: rotate(0deg); }
      12%, 22% { transform: rotate(12deg); }
      27%      { transform: rotate(-5deg); }
      30%      { transform: rotate(2deg); }
      32%      { transform: rotate(0deg); }
      36%, 46% { transform: rotate(-12deg); }
      51%      { transform: rotate(5deg); }
      54%      { transform: rotate(-2deg); }
      56%      { transform: rotate(0deg); }
      59%, 64% { transform: rotate(10deg); }
      69%      { transform: rotate(-4deg); }
      72%, 100%{ transform: rotate(0deg); }
    }
    /* arms: out for balance while rolling, then a show-off routine */
    @keyframes armL {
      0%, 8%   { transform: rotate(0deg); }
      14%, 24% { transform: rotate(-35deg); }
      30%      { transform: rotate(0deg); }
      38%, 46% { transform: rotate(-35deg); }
      54%      { transform: rotate(0deg); }
      62%      { transform: rotate(-35deg); }
      70%, 74% { transform: rotate(0deg); }
      78%      { transform: rotate(-55deg); }
      82%      { transform: rotate(15deg); }
      86%      { transform: rotate(-55deg); }
      90%, 100%{ transform: rotate(0deg); }
    }
    @keyframes armR {
      0%, 8%   { transform: rotate(0deg); }
      14%, 24% { transform: rotate(35deg); }
      30%      { transform: rotate(0deg); }
      38%, 46% { transform: rotate(35deg); }
      54%      { transform: rotate(0deg); }
      62%      { transform: rotate(35deg); }
      70%, 74% { transform: rotate(0deg); }
      78%      { transform: rotate(-15deg); }
      82%      { transform: rotate(55deg); }
      86%      { transform: rotate(-15deg); }
      90%, 100%{ transform: rotate(0deg); }
    }
    /* elbows: forearms reach out while rolling, flex in and out during the show-off */
    @keyframes elbowL {
      0%, 8%   { transform: rotate(0deg); }
      14%, 24% { transform: rotate(-30deg); }
      30%      { transform: rotate(0deg); }
      38%, 46% { transform: rotate(-30deg); }
      54%      { transform: rotate(0deg); }
      62%      { transform: rotate(-30deg); }
      70%      { transform: rotate(0deg); }
      72%      { transform: rotate(35deg); }
      74%      { transform: rotate(0deg); }
      78%      { transform: rotate(-35deg); }
      82%      { transform: rotate(35deg); }
      86%      { transform: rotate(-35deg); }
      90%, 100%{ transform: rotate(0deg); }
    }
    @keyframes elbowR {
      0%, 8%   { transform: rotate(0deg); }
      14%, 24% { transform: rotate(30deg); }
      30%      { transform: rotate(0deg); }
      38%, 46% { transform: rotate(30deg); }
      54%      { transform: rotate(0deg); }
      62%      { transform: rotate(30deg); }
      70%      { transform: rotate(0deg); }
      72%      { transform: rotate(-35deg); }
      74%      { transform: rotate(0deg); }
      78%      { transform: rotate(35deg); }
      82%      { transform: rotate(-35deg); }
      86%      { transform: rotate(35deg); }
      90%, 100%{ transform: rotate(0deg); }
    }
    /* claws snap shut: once after each stop, then twice at the end */
    @keyframes clampIn {
      0%, 27%, 31%, 51%, 55%, 90%, 92.5%, 95%, 97.5%, 100% { transform: rotate(0deg); }
      29%, 53%, 91.2%, 96.2% { transform: rotate(16deg); }
    }
    @keyframes clampOut {
      0%, 27%, 31%, 51%, 55%, 90%, 92.5%, 95%, 97.5%, 100% { transform: rotate(0deg); }
      29%, 53%, 91.2%, 96.2% { transform: rotate(-16deg); }
    }
    @keyframes glow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.85; } }
  </style>

  <rect x="-200" y="0" width="800" height="560" fill="#ffffff"/>

  <g stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M-180 533 C-40 528, 60 537, 160 532 S380 528, 580 534" fill="none"/>

    <g class="move">
      <g class="tilt">
        <!-- leg -->
        <rect x="192" y="418" width="16" height="52" fill="#ffffff"/>
        <!-- unicycle wheel -->
        <g class="wheel">
          <circle cx="200" cy="500" r="32" fill="#ffffff"/>
          <path d="M200 468 L200 532 M168 500 L232 500 M177.4 477.4 L222.6 522.6 M222.6 477.4 L177.4 522.6" fill="none" stroke-width="2.5"/>
          <circle cx="200" cy="500" r="8" fill="#2b2b2b"/>
        </g>

        <!-- body -->
        <rect x="145" y="258" width="110" height="162" fill="#ffffff"/>
        <!-- head -->
        <rect x="112" y="120" width="176" height="140" fill="#ffffff"/>
        <!-- goggle strap -->
        <path d="M112 157 L288 157 M112 173 L288 173" fill="none" stroke-width="3"/>
        <!-- goggles -->
        <rect x="146" y="139" width="50" height="54" rx="20" fill="#e6f4fb"/>
        <rect x="204" y="139" width="50" height="54" rx="20" fill="#e6f4fb"/>
        <path d="M196 163 L204 163" fill="none"/>
        <ellipse cx="172" cy="166" rx="9" ry="16" fill="#ffffff" stroke-width="2.5"/>
        <ellipse cx="228" cy="166" rx="9" ry="16" fill="#ffffff" stroke-width="2.5"/>
        <circle cx="173" cy="169" r="4" fill="#2b2b2b" stroke="none"/>
        <circle cx="229" cy="169" r="4" fill="#2b2b2b" stroke="none"/>
        <!-- smile -->
        <path d="M184 214 C184 240, 216 240, 216 214" fill="none"/>

        <!-- left arm: shoulder, upper arm, elbow, forearm, claw -->
        <g class="armL">
          <g class="elbowL">
            <rect x="62" y="212" width="14" height="79" fill="#ffffff"/>
            <g class="prong pL1"><rect x="36" y="150" width="14" height="52" fill="#ffffff"/></g>
            <g class="prong pL2"><rect x="88" y="150" width="14" height="52" fill="#ffffff"/></g>
            <rect x="36" y="198" width="66" height="14" fill="#ffffff"/>
          </g>
          <rect x="69" y="284" width="76" height="14" fill="#ffffff"/>
          <circle cx="69" cy="291" r="10" fill="#ffffff"/>
          <circle cx="69" cy="291" r="3" fill="#2b2b2b" stroke="none"/>
        </g>
        <!-- right arm -->
        <g class="armR">
          <g class="elbowR">
            <rect x="324" y="212" width="14" height="79" fill="#ffffff"/>
            <g class="prong pR1"><rect x="298" y="150" width="14" height="52" fill="#ffffff"/></g>
            <g class="prong pR2"><rect x="350" y="150" width="14" height="52" fill="#ffffff"/></g>
            <rect x="298" y="198" width="66" height="14" fill="#ffffff"/>
          </g>
          <rect x="255" y="284" width="76" height="14" fill="#ffffff"/>
          <circle cx="331" cy="291" r="10" fill="#ffffff"/>
          <circle cx="331" cy="291" r="3" fill="#2b2b2b" stroke="none"/>
        </g>

        <!-- light -->
        <circle class="glow" cx="200" cy="74" r="40" fill="#c8f7c5" stroke="none"/>
        <path d="M200 30 L200 20 M166 44 L158 36 M234 44 L242 36 M152 74 L142 74 M248 74 L258 74" fill="none" stroke="#2fa84f" stroke-width="3"/>
        <path d="M176 106 L176 70 A24 26 0 0 1 224 70 L224 106 Z" fill="#4cd964"/>
        <path d="M186 96 L186 72 C186 63 190 57 196 54" fill="none" stroke="#ffffff" stroke-width="3"/>
        <rect x="166" y="102" width="68" height="18" rx="5" fill="#2b2b2b"/>
      </g>
    </g>
  </g>
</svg>
