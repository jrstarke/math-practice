<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 400 460" width="400" height="460">
  <rect y="80" width="400" height="460" fill="#ffffff"/>
  <g stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M40 504 C110 499, 170 507, 230 502 S320 499, 360 505" fill="none"/>
    <!--ROBOT-START-->
    <!-- lower arms: thin lines with black oval hands -->
    <path d="M172 404 C120 400, 92 384, 92 352" fill="none"/>
    <path d="M228 404 C280 400, 308 384, 308 352" fill="none"/>
    <ellipse cx="92" cy="332" rx="16" ry="22" fill="#2b2b2b"/>
    <ellipse cx="308" cy="332" rx="16" ry="22" fill="#2b2b2b"/>

    <!-- gliding base -->
    <path d="M128 380 L272 380 L340 500 L60 500 Z" fill="#ffffff"/>

    <!-- propeller arms: tubes from the top corners that bend up -->
    <path d="M124 245 L97 245 L97 180 L83 180 L83 259 L124 259 Z" fill="#ffffff"/>
    <path d="M276 245 L303 245 L303 180 L317 180 L317 259 L276 259 Z" fill="#ffffff"/>
    <!-- rounded caps -->
    <path d="M80 184 L80 172 A10 12 0 0 1 100 172 L100 184 Z" fill="#ffffff"/>
    <path d="M300 184 L300 172 A10 12 0 0 1 320 172 L320 184 Z" fill="#ffffff"/>
    <!-- propeller shafts -->
    <path d="M90 160 L90 144 M310 160 L310 144" fill="none" stroke-width="3"/>
    <!-- three-blade propellers -->
    <g class="propL">
      <ellipse cx="90" cy="130" rx="6" ry="12" fill="#ffffff" stroke-width="2.5"/>
      <ellipse cx="90" cy="130" rx="6" ry="12" fill="#ffffff" stroke-width="2.5" transform="rotate(120 90 142)"/>
      <ellipse cx="90" cy="130" rx="6" ry="12" fill="#ffffff" stroke-width="2.5" transform="rotate(240 90 142)"/>
      <circle cx="90" cy="142" r="3.5" fill="#2b2b2b" stroke="none"/>
    </g>
    <g class="propR">
      <ellipse cx="310" cy="130" rx="6" ry="12" fill="#ffffff" stroke-width="2.5"/>
      <ellipse cx="310" cy="130" rx="6" ry="12" fill="#ffffff" stroke-width="2.5" transform="rotate(120 310 142)"/>
      <ellipse cx="310" cy="130" rx="6" ry="12" fill="#ffffff" stroke-width="2.5" transform="rotate(240 310 142)"/>
      <circle cx="310" cy="142" r="3.5" fill="#2b2b2b" stroke="none"/>
    </g>

    <!-- head, about the same size as Beep's -->
    <rect x="122" y="230" width="156" height="150" fill="#ffffff"/>
    <!-- eyes -->
    <path d="M174 256 L174 282 M226 256 L226 282" fill="none"/>
    <!-- smile -->
    <path d="M184 324 C184 352, 216 352, 216 324" fill="none"/>

    <!-- light: glow, rays, dome and mount -->
    <circle class="glow" cx="200" cy="190" r="34" fill="#c8f7c5" stroke="none" opacity="0.6"/>
    <path d="M200 150 L200 140 M170 162 L163 155 M230 162 L237 155 M160 190 L150 190 M240 190 L250 190" fill="none" stroke="#2fa84f" stroke-width="3"/>
    <path d="M180 216 L180 190 A20 22 0 0 1 220 190 L220 216 Z" fill="#4cd964"/>
    <path d="M189 208 L189 190 C189 182 192 177 197 174" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="172" y="214" width="56" height="16" rx="5" fill="#2b2b2b"/>
    <!--ROBOT-END-->
  </g>
</svg>
