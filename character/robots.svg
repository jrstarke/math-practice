<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <rect width="600" height="360" fill="#ffffff"/>
  <defs>
    <!-- shared head, light and body -->
    <g id="robot">
      <!-- glow -->
      <circle cx="0" cy="-38" r="34" fill="#c8f7c5" stroke="none" opacity="0.6"/>
      <!-- light rays -->
      <path d="M0 -72 L0 -82 M-30 -62 L-37 -69 M30 -62 L37 -69 M-38 -38 L-48 -38 M38 -38 L48 -38" fill="none" stroke="#2fa84f" stroke-width="3"/>
      <!-- green light with a smooth arched top -->
      <path d="M-20 -12 L-20 -38 A20 22 0 0 1 20 -38 L20 -12 Z" fill="#4cd964"/>
      <path d="M-11 -22 L-11 -38 C-11 -46 -7 -51 -2 -53" fill="none" stroke="#ffffff" stroke-width="3"/>
      <!-- body with arched top and flat bottom -->
      <path d="M-65 140 L-65 70 A65 70 0 0 1 65 70 L65 140 Z" fill="#ffffff"/>
      <!-- mount, its bottom following the arch -->
      <path d="M-28 6.8 L-28 -8 Q-28 -12 -24 -12 L24 -12 Q28 -12 28 -8 L28 6.8 A65 70 0 0 0 -28 6.8 Z" fill="#2b2b2b"/>
      <!-- eyes -->
      <path d="M-18 40 L-18 50 M18 40 L18 50" fill="none"/>
    </g>
  </defs>

  <g stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Robot 1 -->
    <g transform="translate(160 110)">
      <!-- legs and feet -->
      <path d="M-35 140 L-38 185 M35 140 L35 200" fill="none"/>
      <ellipse cx="-52" cy="191" rx="19" ry="12" transform="rotate(-10 -52 191)" fill="#2b2b2b"/>
      <ellipse cx="52" cy="206" rx="19" ry="12" transform="rotate(10 52 206)" fill="#2b2b2b"/>
      <use href="#robot"/>
      <!-- flat mouth -->
      <path d="M-22 78 L22 78" fill="none"/>
      <!-- arms and hands -->
      <path d="M-63 75 C-80 80 -88 90 -90 98" fill="none"/>
      <circle cx="-92" cy="108" r="12" fill="#2b2b2b"/>
      <path d="M63 95 C85 95 100 80 104 58" fill="none"/>
      <circle cx="106" cy="44" r="14" fill="#2b2b2b"/>
    </g>

    <!-- Robot 2 -->
    <g transform="translate(430 110)">
      <!-- legs and feet -->
      <path d="M-30 140 L-48 195 M35 140 L35 200" fill="none"/>
      <ellipse cx="-36" cy="205" rx="22" ry="13" transform="rotate(15 -36 205)" fill="#2b2b2b"/>
      <ellipse cx="57" cy="208" rx="22" ry="13" transform="rotate(10 57 208)" fill="#2b2b2b"/>
      <use href="#robot"/>
      <!-- small smile -->
      <path d="M-22 76 Q0 84 22 78" fill="none"/>
      <!-- arms and hands -->
      <path d="M-62 90 C-80 92 -92 110 -100 122" fill="none"/>
      <circle cx="-106" cy="133" r="13" fill="#2b2b2b"/>
      <path d="M64 82 L96 82 L96 52" fill="none"/>
      <circle cx="96" cy="38" r="14" fill="#2b2b2b"/>
    </g>
  </g>
</svg>
